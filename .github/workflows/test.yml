---
name: test
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  smoke-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Create sample file
        shell: bash
        run: echo payload > sample.txt

      - name: Upload and verify
        id: basic
        uses: ./
        with:
          name: sample-${{ runner.os }}-${{ github.run_attempt }}
          path: sample.txt

      - name: Download by returned ID
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ steps.basic.outputs.artifact-id }}
          path: downloaded

      - name: Check downloaded data
        shell: bash
        run: cmp sample.txt downloaded/sample.txt

      - name: Upload with pre and post commands
        uses: ./
        with:
          name: commands-${{ runner.os }}-${{ github.run_attempt }}.txt
          path: commands-${{ runner.os }}-${{ github.run_attempt }}.txt
          pre_command: echo payload > commands-${{ runner.os }}-${{ github.run_attempt }}.txt
          post_command: test "$(cat "{{download_path}}")" = payload

  retry-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Inject a transient download failure
        shell: bash
        run: |
          mkdir -p .github/test-actions/verify
          sed 's|uses: actions/download-artifact@v7|uses: ./.github/test-actions/flaky-download|' action.yml > .github/test-actions/verify/action.yml
          echo payload > retry.txt

      - name: Upload and verify after a transient download failure
        id: retry
        uses: ./.github/test-actions/verify
        with:
          name: retry.txt
          path: retry.txt
          post_command: test "$(cat "{{download_path}}")" = payload

      - name: Confirm the simulated failure occurred
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.retry.outputs.artifact-id }}
        run: |
          test -n "$ARTIFACT_ID"
          test -f "$RUNNER_TEMP/artifact-check-$ARTIFACT_ID"

      - name: Missing source file must still fail
        id: missing
        uses: ./
        continue-on-error: true
        with:
          name: missing
          path: does-not-exist.txt

      - name: Check failure
        if: steps.missing.outcome != 'failure'
        shell: bash
        run: exit 1
