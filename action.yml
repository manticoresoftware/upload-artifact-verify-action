---
# https://help.github.com/en/articles/metadata-syntax-for-github-actions
name: 'upload-artifact-verify'
description: "GitHub Action to upload an artifact and verify it worked by downloading it again to a temporary directory."
author: 'cytopia'
branding:
  icon: 'code'
  color: 'red'

inputs:
  name:
    description: 'The artifact name.'
    required: true
  path:
    description: 'The local file to upload.'
    required: true
  pre_command:
    description: 'A bash command to execute before uploading the artifact (e.g.: to create the artifact)'
    required: false
    default: ''
  post_command:
    description: 'A bash command to execute after downloading the artifact (e.g.: to verify it is the desired file)'
    required: false
    default: ''

outputs:
  artifact-id:
    description: 'The ID of the uploaded artifact.'
    value: ${{ steps.upload.outputs.artifact-id }}

runs:
  using: "composite"
  steps:

    - name: Execute pre command
      uses: cytopia/shell-command-retry-action@v0.1.6
      with:
        retries: 3
        pause: 1
        command: ${{ inputs.pre_command }}
      if: ${{ inputs.pre_command != '' }}

    - name: Upload artifact
      id: upload
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: error

    - name: Create temporary directory
      id: tmp-dir
      shell: bash
      run: |
        DIRECTORY="$( mktemp -d )"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          DIRECTORY="$(cygpath -m "$DIRECTORY")"
        fi
        echo "path=${DIRECTORY}" >> "$GITHUB_OUTPUT"

    # Upload is complete. Retry only verification, never the upload.
    - name: Download artifact for verification (attempt 1)
      id: download1
      uses: actions/download-artifact@v7
      continue-on-error: true
      with:
        artifact-ids: ${{ steps.upload.outputs.artifact-id }}
        path: ${{ steps.tmp-dir.outputs.path }}

    - name: Wait before download attempt 2
      if: steps.download1.outcome == 'failure'
      shell: bash
      run: sleep 2

    - name: Download artifact for verification (attempt 2)
      id: download2
      if: steps.download1.outcome == 'failure'
      uses: actions/download-artifact@v7
      continue-on-error: true
      with:
        artifact-ids: ${{ steps.upload.outputs.artifact-id }}
        path: ${{ steps.tmp-dir.outputs.path }}

    - name: Wait before download attempt 3
      if: steps.download2.outcome == 'failure'
      shell: bash
      run: sleep 5

    - name: Download artifact for verification (attempt 3)
      id: download3
      if: steps.download2.outcome == 'failure'
      uses: actions/download-artifact@v7
      continue-on-error: true
      with:
        artifact-ids: ${{ steps.upload.outputs.artifact-id }}
        path: ${{ steps.tmp-dir.outputs.path }}

    - name: Wait before download attempt 4
      if: steps.download3.outcome == 'failure'
      shell: bash
      run: sleep 10

    - name: Download artifact for verification (attempt 4)
      id: download4
      if: steps.download3.outcome == 'failure'
      uses: actions/download-artifact@v7
      continue-on-error: true
      with:
        artifact-ids: ${{ steps.upload.outputs.artifact-id }}
        path: ${{ steps.tmp-dir.outputs.path }}

    - name: Wait before download attempt 5
      if: steps.download4.outcome == 'failure'
      shell: bash
      run: sleep 20

    - name: Download artifact for verification (attempt 5)
      id: download5
      if: steps.download4.outcome == 'failure'
      uses: actions/download-artifact@v7
      with:
        artifact-ids: ${{ steps.upload.outputs.artifact-id }}
        path: ${{ steps.tmp-dir.outputs.path }}

    - name: set placeholder
      id: placeholder
      shell: bash
      env:
        COMMAND: ${{ inputs.post_command }}
        REPLACE: ${{ steps.tmp-dir.outputs.path }}/${{ inputs.name }}
      run: |
        COMMAND="${COMMAND//\{\{download_path\}\}/${REPLACE}}"
        echo "command=${COMMAND}" >> $GITHUB_OUTPUT
      if: ${{ inputs.post_command != '' }}

    - name: Execute post command
      uses: cytopia/shell-command-retry-action@v0.1.6
      with:
        retries: 3
        pause: 1
        command: ${{ steps.placeholder.outputs.command }}
      if: ${{ inputs.post_command != '' }}
